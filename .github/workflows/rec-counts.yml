name: Log rec counts

on:
  schedule:
    - cron: "18,48 * * * *"   # every 30 minutes, all day
  workflow_dispatch:          # adds a manual "Run workflow" button

permissions:
  contents: write             # lets the job commit the CSV back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago     # makes the CSV's logged_at use Lubbock time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_counts.py

      - name: Commit CSV if it changed
        run: |
          git config user.name "rec-counts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rec_counts.csv || true
          git diff --staged --quiet || (git commit -m "Update rec counts" && git push)
